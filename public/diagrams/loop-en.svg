<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="The Action, Response, Benefit loop" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The Action, Response, Benefit loop</title><style>@keyframes hl{0%{opacity:0}5%,31%{opacity:1}38%,100%{opacity:0}}@keyframes ex{0%{opacity:.45}5%,31%{opacity:1}38%,100%{opacity:.45}}@keyframes flow{to{stroke-dashoffset:-22}}.hl1,.hl2{opacity:0}.ex{opacity:.75}@media (prefers-reduced-motion: no-preference){.hl{animation:hl 6s infinite backwards}.ex{animation:ex 6s infinite backwards}.hl1,.ex1{animation-delay:2s}.hl2,.ex2{animation-delay:4s}.flow{animation:flow 1.1s linear infinite}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9bbff"/></marker></defs><rect width="800" height="250" rx="18" fill="#0f0a20" stroke="#3a2f6b"/><path class="flow" d="M650 92 V52 H150 V88" fill="none" stroke="#aaa0cf" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/><text x="400" y="40" font-size="14" fill="#aaa0cf" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">The same loop repeats with every record</tspan></text><rect x="50" y="92" width="200" height="76" rx="14" fill="#1a1433" stroke="#3a2f6b" stroke-width="1.5"/><rect class="hl hl0" x="50" y="92" width="200" height="76" rx="14" fill="#7a5cff" stroke="#7a5cff" stroke-width="1.5"/><text x="150" y="137" font-size="21" fill="#fff" font-weight="650" text-anchor="middle"><tspan x="150" dy="0">Action</tspan></text><text class="ex ex0" x="150" y="200" font-size="15" fill="#efeaff" font-weight="400" text-anchor="middle"><tspan x="150" dy="0">I record an expense</tspan></text><path d="M256 130 H292" fill="none" stroke="#c9bbff" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="92" width="200" height="76" rx="14" fill="#1a1433" stroke="#3a2f6b" stroke-width="1.5"/><rect class="hl hl1" x="300" y="92" width="200" height="76" rx="14" fill="#7a5cff" stroke="#7a5cff" stroke-width="1.5"/><text x="400" y="137" font-size="21" fill="#fff" font-weight="650" text-anchor="middle"><tspan x="400" dy="0">Response</tspan></text><text class="ex ex1" x="400" y="200" font-size="15" fill="#efeaff" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">It shows up saved</tspan><tspan x="400" dy="19.5">in my list</tspan></text><path d="M506 130 H542" fill="none" stroke="#c9bbff" stroke-width="2" marker-end="url(#a)"/><rect x="550" y="92" width="200" height="76" rx="14" fill="#1a1433" stroke="#3a2f6b" stroke-width="1.5"/><rect class="hl hl2" x="550" y="92" width="200" height="76" rx="14" fill="#7a5cff" stroke="#7a5cff" stroke-width="1.5"/><text x="650" y="137" font-size="21" fill="#fff" font-weight="650" text-anchor="middle"><tspan x="650" dy="0">Benefit</tspan></text><text class="ex ex2" x="650" y="200" font-size="15" fill="#efeaff" font-weight="400" text-anchor="middle"><tspan x="650" dy="0">I see how much</tspan><tspan x="650" dy="19.5">I have spent today</tspan></text></svg>