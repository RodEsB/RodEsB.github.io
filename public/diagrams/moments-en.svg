<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 215" width="800" height="215" role="img" aria-label="The three moments to take care of" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>The three moments to take care of</title><style>@keyframes trav{0%{transform:translateX(130px);opacity:1}30%,44%{transform:translateX(400px);opacity:1}50%{transform:translateX(400px);opacity:.25}80%{transform:translateX(670px);opacity:.25}85%,96%{transform:translateX(670px);opacity:1}100%{transform:translateX(670px);opacity:0}}@keyframes ring{0%{transform:scale(1);opacity:.8}14%{transform:scale(2.6);opacity:0}100%{transform:scale(2.6);opacity:0}}.ring{opacity:0;transform-box:fill-box;transform-origin:center}.trav{opacity:0}@media (prefers-reduced-motion: no-preference){.trav{animation:trav 8s ease-in-out infinite}.ring{animation:ring 8s ease-out infinite backwards}.ring0{animation-delay:0s}.ring1{animation-delay:2.4s}.ring2{animation-delay:6.7s}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9bbff"/></marker></defs><rect width="800" height="215" rx="18" fill="#0f0a20" stroke="#3a2f6b"/><path d="M130 84 H400" stroke="#7a5cff" stroke-width="3"/><path d="M400 84 H670" stroke="#3a2f6b" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><text x="535.0" y="64" font-size="14" fill="#aaa0cf" font-weight="400" text-anchor="middle"><tspan x="535.0" dy="0">days without using the app</tspan></text><circle class="ring ring0" cx="130" cy="84" r="9" fill="none" stroke="#c9bbff" stroke-width="2"/><circle cx="130" cy="84" r="9" fill="#7a5cff" stroke="#7a5cff" stroke-width="3"/><text x="130" y="128" font-size="19" fill="#efeaff" font-weight="650" text-anchor="middle"><tspan x="130" dy="0">Starting</tspan></text><text x="130" y="153" font-size="14.5" fill="#aaa0cf" font-weight="400" text-anchor="middle"><tspan x="130" dy="0">The first time</tspan></text><text x="130" y="180" font-size="14.5" fill="#c9bbff" font-weight="600" text-anchor="middle"><tspan x="130" dy="0">Principles 1 to 4 and 6</tspan></text><circle class="ring ring1" cx="400" cy="84" r="9" fill="none" stroke="#c9bbff" stroke-width="2"/><circle cx="400" cy="84" r="9" fill="#7a5cff" stroke="#7a5cff" stroke-width="3"/><text x="400" y="128" font-size="19" fill="#efeaff" font-weight="650" text-anchor="middle"><tspan x="400" dy="0">Recording regularly</tspan></text><text x="400" y="153" font-size="14.5" fill="#aaa0cf" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">Everyday use</tspan></text><text x="400" y="180" font-size="14.5" fill="#c9bbff" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Principle 5</tspan></text><circle class="ring ring2" cx="670" cy="84" r="9" fill="none" stroke="#c9bbff" stroke-width="2"/><circle cx="670" cy="84" r="9" fill="#0f0a20" stroke="#7a5cff" stroke-width="3"/><text x="670" y="128" font-size="19" fill="#efeaff" font-weight="650" text-anchor="middle"><tspan x="670" dy="0">Coming back</tspan></text><text x="670" y="153" font-size="14.5" fill="#aaa0cf" font-weight="400" text-anchor="middle"><tspan x="670" dy="0">After a break</tspan></text><text x="670" y="180" font-size="14.5" fill="#c9bbff" font-weight="600" text-anchor="middle"><tspan x="670" dy="0">Principle 7</tspan></text><circle class="trav" cx="0" cy="84" r="5.5" fill="#fff"/></svg>