<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 285" width="800" height="285" role="img" aria-label="Cuándo pedir una cuenta o un permiso" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Cuándo pedir una cuenta o un permiso</title><style>@keyframes col{0%{opacity:.3}5%,30%{opacity:1}37%,100%{opacity:.3}}@keyframes pop{0%,8%{transform:scale(1)}13%{transform:scale(1.06)}19%,100%{transform:scale(1)}}.pop{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: no-preference){.col{animation:col 9s infinite backwards}.col .pop{animation:pop 9s infinite backwards}.col1,.col1 .pop{animation-delay:3s}.col2,.col2 .pop{animation-delay:6s}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9bbff"/></marker></defs><rect width="800" height="285" rx="18" fill="#0f0a20" stroke="#3a2f6b"/><text x="30" y="92" font-size="14" fill="#aaa0cf" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Lo que</tspan><tspan x="30" dy="18.2">quiere la persona</tspan></text><text x="30" y="222" font-size="14" fill="#aaa0cf" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Lo que</tspan><tspan x="30" dy="18.2">pide la app</tspan></text><g class="col col0"><rect x="215" y="56" width="170" height="76" rx="14" fill="#1a1433" stroke="#3a2f6b" stroke-width="1.5"/><text x="300" y="90" font-size="15.5" fill="#efeaff" font-weight="500" text-anchor="middle"><tspan x="300" dy="0">Abrir la app</tspan><tspan x="300" dy="20.150000000000002">y probarla</tspan></text><path d="M300 138 V184" fill="none" stroke="#c9bbff" stroke-width="2" marker-end="url(#a)"/><g class="pop"><rect x="215" y="190" width="170" height="62" rx="14" fill="none" stroke="#3a2f6b" stroke-width="1.5"/><text x="300" y="227" font-size="15.5" fill="#aaa0cf" font-weight="650" text-anchor="middle"><tspan x="300" dy="0">Nada todavía</tspan></text></g></g><g class="col col1"><rect x="410" y="56" width="170" height="76" rx="14" fill="#1a1433" stroke="#3a2f6b" stroke-width="1.5"/><text x="495" y="90" font-size="15.5" fill="#efeaff" font-weight="500" text-anchor="middle"><tspan x="495" dy="0">Respaldar</tspan><tspan x="495" dy="20.150000000000002">sus datos</tspan></text><path d="M495 138 V184" fill="none" stroke="#c9bbff" stroke-width="2" marker-end="url(#a)"/><g class="pop"><rect x="410" y="190" width="170" height="62" rx="14" fill="#7a5cff" stroke="#7a5cff" stroke-width="1.5"/><text x="495" y="227" font-size="15.5" fill="#fff" font-weight="650" text-anchor="middle"><tspan x="495" dy="0">Crear una cuenta</tspan></text></g></g><g class="col col2"><rect x="605" y="56" width="170" height="76" rx="14" fill="#1a1433" stroke="#3a2f6b" stroke-width="1.5"/><text x="690" y="90" font-size="15.5" fill="#efeaff" font-weight="500" text-anchor="middle"><tspan x="690" dy="0">Escanear</tspan><tspan x="690" dy="20.150000000000002">un recibo</tspan></text><path d="M690 138 V184" fill="none" stroke="#c9bbff" stroke-width="2" marker-end="url(#a)"/><g class="pop"><rect x="605" y="190" width="170" height="62" rx="14" fill="#7a5cff" stroke="#7a5cff" stroke-width="1.5"/><text x="690" y="227" font-size="15.5" fill="#fff" font-weight="650" text-anchor="middle"><tspan x="690" dy="0">Permiso de cámara</tspan></text></g></g></svg>